[build]
builder = "nixpacks"
buildCommand = "pip install --break-system-packages -r backend/requirements.txt && cd frontend && npm install && npm run build"

[deploy]
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/stats"
restartPolicyType = "on_failure"
